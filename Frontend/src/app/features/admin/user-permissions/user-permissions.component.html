<div class="table-card mat-elevation-z1">
  <div class="table-header">
    <h2 class="table-title">User Permissions</h2>
    
    <div class="header-actions">
      <mat-form-field appearance="outline" style="margin-bottom: -1.25em;">
        <mat-label>Select User</mat-label>
        <mat-select [(ngModel)]="selectedUserId" (selectionChange)="onUserChange()">
          <mat-option *ngFor="let user of users" [value]="user.userId">
            {{ user.fullName }} ({{ user.loginId }})
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  <div *ngIf="permissions.length > 0" class="table-container">
    <table mat-table [dataSource]="permissions" class="mat-table" style="width: 100%;">

      <ng-container matColumnDef="menuName">
        <th mat-header-cell *matHeaderCellDef> Menu </th>
        <td mat-cell *matCellDef="let element"> {{element.menuName}} </td>
      </ng-container>

      <ng-container matColumnDef="canView">
        <th mat-header-cell *matHeaderCellDef class="text-center"> View </th>
        <td mat-cell *matCellDef="let element" class="text-center">
          <mat-checkbox [(ngModel)]="element.canView" color="primary"></mat-checkbox>
        </td>
      </ng-container>

      <ng-container matColumnDef="canAdd">
        <th mat-header-cell *matHeaderCellDef class="text-center"> Add </th>
        <td mat-cell *matCellDef="let element" class="text-center">
          <mat-checkbox [(ngModel)]="element.canAdd" color="primary"></mat-checkbox>
        </td>
      </ng-container>

      <ng-container matColumnDef="canEdit">
        <th mat-header-cell *matHeaderCellDef class="text-center"> Edit </th>
        <td mat-cell *matCellDef="let element" class="text-center">
          <mat-checkbox [(ngModel)]="element.canEdit" color="primary"></mat-checkbox>
        </td>
      </ng-container>

      <ng-container matColumnDef="canDelete">
        <th mat-header-cell *matHeaderCellDef class="text-center"> Delete </th>
        <td mat-cell *matCellDef="let element" class="text-center">
          <mat-checkbox [(ngModel)]="element.canDelete" color="primary"></mat-checkbox>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <div style="display: flex; justify-content: flex-end; padding: 16px;">
      <button class="btn-gradient" (click)="savePermissions()">
        <mat-icon style="font-size: 18px; width: 18px; height: 18px;">save</mat-icon> Save Permissions
      </button>
    </div>
  </div>
</div>
