<div class="table-card mat-elevation-z1">
  <div class="table-header">
    <h2 class="table-title">Manage Users</h2>
    <button class="btn-gradient" (click)="openAddUserDialog()">
      <mat-icon style="font-size: 18px; width: 18px; height: 18px;">add</mat-icon> Create New User
    </button>
  </div>
  
  <div class="table-container">
    <table mat-table [dataSource]="users" class="mat-table" style="width: 100%;">

      <ng-container matColumnDef="fullName">
        <th mat-header-cell *matHeaderCellDef> Full Name </th>
        <td mat-cell *matCellDef="let element"> {{element.fullName}} </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef> Email </th>
        <td mat-cell *matCellDef="let element"> {{element.email}} </td>
      </ng-container>

      <ng-container matColumnDef="loginId">
        <th mat-header-cell *matHeaderCellDef> Login ID </th>
        <td mat-cell *matCellDef="let element"> {{element.loginId}} </td>
      </ng-container>

      <ng-container matColumnDef="isActive">
        <th mat-header-cell *matHeaderCellDef class="text-center"> Status </th>
        <td mat-cell *matCellDef="let element" class="text-center">
          <span [ngStyle]="{'color': element.isActive ? 'green' : 'red'}">
            {{element.isActive ? 'Active' : 'Inactive'}}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="text-center"> Actions </th>
        <td mat-cell *matCellDef="let element" class="text-center">
          <button mat-icon-button color="primary" (click)="resetPassword(element)" title="Reset Password">
            <mat-icon>lock_reset</mat-icon>
          </button>
          <button mat-icon-button [color]="element.isActive ? 'warn' : 'primary'" (click)="deactivateUser(element)" title="{{element.isActive ? 'Deactivate' : 'Activate'}}">
            <mat-icon>{{element.isActive ? 'block' : 'check_circle'}}</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
