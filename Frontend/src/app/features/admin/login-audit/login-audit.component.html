<div class="table-card mat-elevation-z1">
  <div class="table-header" style="flex-wrap: wrap;">
    <h2 class="table-title">Login Audit Report</h2>
    
    <div class="header-actions">
      <form [formGroup]="filterForm" (ngSubmit)="fetchReport()" style="display: flex; gap: 16px; align-items: center;">
        <mat-form-field appearance="outline" style="margin-bottom: -1.25em;">
          <mat-label>Start Date</mat-label>
          <input matInput [matDatepicker]="startPicker" formControlName="startDate">
          <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
          <mat-datepicker #startPicker></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline" style="margin-bottom: -1.25em;">
          <mat-label>End Date</mat-label>
          <input matInput [matDatepicker]="endPicker" formControlName="endDate">
          <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
          <mat-datepicker #endPicker></mat-datepicker>
        </mat-form-field>

        <button class="btn-gradient" type="submit" style="height: 40px; margin-bottom: 0;">
          <mat-icon style="font-size: 18px; width: 18px; height: 18px;">filter_list</mat-icon> Filter
        </button>
      </form>
    </div>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="reports" class="mat-table" style="width: 100%;">

      <ng-container matColumnDef="userName">
        <th mat-header-cell *matHeaderCellDef> User Name </th>
        <td mat-cell *matCellDef="let element"> {{element.userName}} </td>
      </ng-container>

      <ng-container matColumnDef="loginDateTime">
        <th mat-header-cell *matHeaderCellDef class="text-center"> Login Time </th>
        <td mat-cell *matCellDef="let element" class="text-center"> {{element.loginDateTime | date:'medium'}} </td>
      </ng-container>

      <ng-container matColumnDef="logoutDateTime">
        <th mat-header-cell *matHeaderCellDef class="text-center"> Logout Time </th>
        <td mat-cell *matCellDef="let element" class="text-center"> {{element.logoutDateTime | date:'medium'}} </td>
      </ng-container>

      <ng-container matColumnDef="durationMinutes">
        <th mat-header-cell *matHeaderCellDef class="text-center"> Duration (mins) </th>
        <td mat-cell *matCellDef="let element" class="text-center"> {{element.durationMinutes}} </td>
      </ng-container>

      <ng-container matColumnDef="ipAddress">
        <th mat-header-cell *matHeaderCellDef> IP Address </th>
        <td mat-cell *matCellDef="let element"> {{element.ipAddress}} </td>
      </ng-container>

      <ng-container matColumnDef="browserInfo">
        <th mat-header-cell *matHeaderCellDef> Browser Info </th>
        <td mat-cell *matCellDef="let element"> {{element.browserInfo}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
