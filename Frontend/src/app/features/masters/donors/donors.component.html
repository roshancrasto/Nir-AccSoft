<div class="container">
  <div class="table-card">
    <div class="table-header" style="display: flex; justify-content: space-between; align-items: center;">
      <div style="flex: 1; display: flex; justify-content: flex-start;">
        <input type="text" placeholder="Search Donors..." (keyup)="applyFilter($event)" style="min-width: 200px; padding: 8px 12px; border-radius: 6px; border: 1px solid #ddd; outline: none;">
      </div>
      
      <div style="flex: 1; text-align: center;">
        <h3 style="margin: 0;">Donors Master</h3>
      </div>

      <div style="flex: 1; display: flex; justify-content: flex-end;">
        <button [disabled]="!canAdd" class="btn-gradient" (click)="openAddDialog()" style="padding: 8px 16px;">
          <mat-icon style="font-size: 18px; width: 18px; height: 18px; margin-right: 4px;">person_add</mat-icon> Add Donor
        </button>
      </div>
    </div>
    
    <div class="loading-container" *ngIf="isLoading" style="padding: 20px; text-align: center;">
      <mat-spinner diameter="40" style="margin: 0 auto;"></mat-spinner>
      <p>Loading donors...</p>
    </div>

    <div class="table-responsive" *ngIf="!isLoading">
      <table mat-table [dataSource]="dataSource">
        
        <ng-container matColumnDef="donorName">
          <th mat-header-cell *matHeaderCellDef> Donor Name </th>
          <td mat-cell *matCellDef="let element"> {{element.donorName}} </td>
        </ng-container>

        <ng-container matColumnDef="mobileNumber">
          <th mat-header-cell *matHeaderCellDef> Mobile </th>
          <td mat-cell *matCellDef="let element"> {{element.mobileNumber || '-'}} </td>
        </ng-container>

        <ng-container matColumnDef="dPlace">
          <th mat-header-cell *matHeaderCellDef> Place </th>
          <td mat-cell *matCellDef="let element"> {{element.dPlace || '-'}} </td>
        </ng-container>

        <ng-container matColumnDef="dCity">
          <th mat-header-cell *matHeaderCellDef> City </th>
          <td mat-cell *matCellDef="let element"> {{element.dCity || '-'}} </td>
        </ng-container>

        <ng-container matColumnDef="dState">
          <th mat-header-cell *matHeaderCellDef> State </th>
          <td mat-cell *matCellDef="let element"> {{element.dState || '-'}} </td>
        </ng-container>

        <ng-container matColumnDef="isUdyavarParish">
          <th mat-header-cell *matHeaderCellDef> Parish Member </th>
          <td mat-cell *matCellDef="let element"> 
            <span class="badge bank" *ngIf="element.isUdyavarParish">Yes</span>
            <span *ngIf="!element.isUdyavarParish">-</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="isActive">
          <th mat-header-cell *matHeaderCellDef> Status </th>
          <td mat-cell *matCellDef="let element"> 
            <span class="badge" [ngClass]="element.isActive ? 'bank' : 'cash'">
              {{element.isActive ? 'Active' : 'Inactive'}}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions" stickyEnd>
          <th mat-header-cell *matHeaderCellDef> Actions </th>
          <td mat-cell *matCellDef="let element">
            <div class="actions">
              <button [disabled]="!canEdit" class="btn-edit" matTooltip="Edit" (click)="openEditDialog(element)">
                <mat-icon style="font-size: 18px; width: 18px; height: 18px;">edit</mat-icon>
              </button>
              <button [disabled]="!canDelete" class="btn-delete" matTooltip="Delete" (click)="deleteDonor(element.donorId)">
                <mat-icon style="font-size: 18px; width: 18px; height: 18px;">delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="8" style="text-align: center; padding: 20px;">No donors found.</td>
        </tr>
      </table>
    </div>
    <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" [showFirstLastButtons]="true" aria-label="Select page of donors"></mat-paginator>
  </div>
</div>
