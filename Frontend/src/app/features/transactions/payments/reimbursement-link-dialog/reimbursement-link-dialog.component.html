<h2 mat-dialog-title>
  <mat-icon style="vertical-align: middle; margin-right: 8px;">checklist</mat-icon>
  Select Expenses to Link
</h2>

<mat-dialog-content>
  <div class="table-container mat-elevation-z1" *ngIf="pendingLinks.length > 0">
    <table mat-table [dataSource]="pendingLinks" style="width: 100%;">
      
      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef style="width: 50px;">
          <mat-checkbox (change)="toggleAll($event.checked)"
                        [checked]="isAllSelected()"
                        color="primary">
          </mat-checkbox>
        </th>
        <td mat-cell *matCellDef="let row">
          <mat-checkbox (change)="toggleSelection(row.expenseId, $event.checked)"
                        [checked]="selectedIds.has(row.expenseId)"
                        color="primary">
          </mat-checkbox>
        </td>
      </ng-container>

      <ng-container matColumnDef="memberName">
        <th mat-header-cell *matHeaderCellDef> Member </th>
        <td mat-cell *matCellDef="let row"> {{row.memberName}} </td>
      </ng-container>

      <ng-container matColumnDef="eventGroupName">
        <th mat-header-cell *matHeaderCellDef> Event Group </th>
        <td mat-cell *matCellDef="let row"> {{row.eventGroupName}} </td>
      </ng-container>

      <ng-container matColumnDef="categoryName">
        <th mat-header-cell *matHeaderCellDef> Category </th>
        <td mat-cell *matCellDef="let row"> {{row.categoryName}} </td>
      </ng-container>

      <ng-container matColumnDef="expenseDetails">
        <th mat-header-cell *matHeaderCellDef> Details </th>
        <td mat-cell *matCellDef="let row"> {{row.expenseDetails}} </td>
      </ng-container>

      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef> Amount </th>
        <td mat-cell *matCellDef="let row"> {{row.amount | currency:'INR'}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <div class="empty-state" *ngIf="pendingLinks.length === 0" style="padding: 2rem; text-align: center; color: #666;">
    <mat-icon style="font-size: 48px; height: 48px; width: 48px; margin-bottom: 1rem;">info_outline</mat-icon>
    <p>No pending expenses found.</p>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close style="color: #64748b;">Cancel</button>
  <button class="btn-gradient" (click)="onSave()" [disabled]="pendingLinks.length === 0">Add Selected ({{selectedIds.size}})</button>
</mat-dialog-actions>
